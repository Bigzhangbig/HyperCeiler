name: LSPosed preference compatibility

on:
  push:
    branches: [a14_eol, fix/lsposed-preferences-compat]
  pull_request:
    branches: [a14_eol]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_ACTOR: ${{ github.actor }}
      GIT_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 tests/check_packages_access.py
      - run: python3 tests/inspect_upstream_packages.py

  preferences:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: ./gradlew -p tests/preferences test --console=plain

  apk:
    needs: preferences
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GIT_ACTOR: ${{ github.actor }}
      GIT_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Check upstream package access
        run: python3 tests/check_packages_access.py
      - name: Check migration commands with the real upstream validator
        run: |
          python3 tests/inspect_upstream_packages.py
          compat_classes=$(mktemp -d)
          compat_classpath="$ANDROID_HOME/platforms/android-36/android.jar:tests/preferences/build/upstream/expansion.jar:tests/preferences/build/upstream/lsparanoid-core.jar"
          javac -cp "$compat_classpath" -d "$compat_classes" \
            library/hook/src/main/java/com/sevtinge/hyperceiler/hook/utils/prefs/LegacyPrefsMigration.java \
            library/hook/src/main/java/com/sevtinge/hyperceiler/hook/utils/prefs/SharedPrefsXml.java \
            tests/MigrationShellContract.java
          java -cp "$compat_classes:$compat_classpath" MigrationShellContract
      - name: Build debug and optimized APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain --max-workers=2
      - name: Check packaged module descriptors and manifest
        run: python3 tests/check_apk_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: HyperCeiler-A14-API101
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
